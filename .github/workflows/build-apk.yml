# Builds an installable Android APK straight from the files in this repo.
# No GitHub Pages and no hosting needed: index.html is packed INSIDE the APK.
# Runs on every push to main, or manually: Actions > "Build Android APK" > Run workflow.
# Download the result from the run page: Artifacts > Sprintly-apk.
name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Create Capacitor project with the app inside
        run: |
          set -e
          W="$RUNNER_TEMP/wrapper"
          mkdir -p "$W/www"
          cp index.html sw.js manifest.webmanifest icon-*.png "$W/www/"
          cd "$W"
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.sprintly.app",
            "appName": "Sprintly",
            "webDir": "www",
            "android": { "backgroundColor": "#EFE8D4" }
          }
          JSON
          npx cap add android
          npx cap sync android
          # launcher icons
          R="android/app/src/main/res"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "$GITHUB_WORKSPACE/icon-512.png" "$R/mipmap-$d/ic_launcher.png"
            cp "$GITHUB_WORKSPACE/icon-512.png" "$R/mipmap-$d/ic_launcher_round.png"
            cp "$GITHUB_WORKSPACE/icon-maskable-512.png" "$R/mipmap-$d/ic_launcher_foreground.png"
          done
          sed -i 's/#FFFFFF/#2A3646/I' "$R/values/ic_launcher_background.xml"

      - name: Build APK
        run: |
          cd "$RUNNER_TEMP/wrapper/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Sprintly-apk
          path: ${{ runner.temp }}/wrapper/android/app/build/outputs/apk/debug/app-debug.apk
